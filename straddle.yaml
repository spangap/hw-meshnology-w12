# hw-meshnology-w12 — board HAL straddle for the Meshnology W12.
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the board usable by an app. The reticulous/reticulous
# buildable adds it with `--with spangap/hw-meshnology-w12` and inherits the
# board's pin map, bring-up hooks and hardware kconfig.
#
# Owns the W12 board HAL (esp-idf/src/w12.cpp: the Vext peripheral rail, the
# sub-GHz front end's supply, the LoRa CS park, the GNSS rails and the battery
# sense). app_main, partitions, the OTA story and the browser SPA are NOT here —
# they belong to the buildable.
#
# Board reference:
# https://meshnology.com/products/meshnology-w12-lr2021-ultra-long-range-lora-meshtastic-device-kit
schema_version: 1
name: spangap/hw-meshnology-w12
prefix: w12
firmware: esp-idf
version: 0.0.0
platforms: [idf]
# What this board pulls in: the paged mono-OLED UI, because the W12's only
# screen is a 0.96" SSD1315 (an SSD1306 part) — the colour-TFT UI (spangap-lcd)
# would have nothing to draw on — and the GNSS straddle for the L76K receiver
# the kits ship with. A W12 sold without the receiver populated wants
# `--without spangap/gps`; the UART then simply carries nothing.
additional_installs:
  - spangap/tinylcd
  - spangap/gps
# Board bring-up as registered Services. app_main is generated by the buildable;
# it constructs these in listed order and walks them (onStart before spangapInit,
# onInit after).
#   W12Board.onStart — bare-hardware: the Vext peripheral rail (OLED + GNSS),
#     the sub-GHz front end's supply, the GNSS reset/enable lines and the LoRa
#     CS park. Runs before spangapInit(), so the panel is powered before
#     tinylcd's task initialises it. Its onInit publishes sys.board, which needs
#     storage.
#   W12Battery.onInit — 1/min esp_timer publishing battery.millivolt /
#     battery.percent. Always on — no UI dependency.
services:
  - { class: W12Board,   header: w12.h }
  - { class: W12Battery, header: w12.h }

# Declarative settings: the board's rows on the System page. What this board
# offers is device-wide, not a program, so it lands on System; the order puts
# Hardware at the top, ahead of the unordered blocks the platform straddles
# contribute there. (The Display rows are tinylcd's own contribution, and the
# GPS section is gps's.)
settings:
  - at: [ { id: system } ]
    order: 10
    rows:
      - section: "Hardware"
      - info:
          rows:
            - value: { label: "Board", key: "sys.board" }
            - value: { label: "Radio", key: "lora.0.chip" }

# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: ESP32-S3R8 — 16 MB QIO flash, 8 MB *octal* PSRAM. Two numbers:
  #   * FLASHSIZE — the flash CONTAINER / bootloader-header size, pinned to the
  #     real 16 MB chip.
  #   * MAX_FIRMWARE_KB — the offset where the runtime read-write /state
  #     partition begins; /state fills the rest of the chip (~10 MB here). 6 MB
  #     = the headless app+fixed (~2.8 MB) plus growth headroom, the same split
  #     as the other 16 MB OLED board (hw-heltecv4). WITHOUT this the floor
  #     defaults to the whole flash container, `app` expands to fill all 16 MB
  #     and NO /state partition exists.
  # Changing MAX_FIRMWARE_KB relocates /state → existing devices factory-reset
  # on the next boot, so warn users before bumping it.
  - CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  - CONFIG_SPANGAP_MAX_FIRMWARE_KB=6144
  - CONFIG_SPIRAM_MODE_OCT=y
  # One Semtech LR2021 on its own SPI bus (host 2), separate from the flash bus.
  # Gated on iface-lora: the CONFIG_LORA_* symbols are DEFINED by that
  # straddle's Kconfig, so applying these in a build without it would warn as
  # unknown symbols.
  - when: reticulous/iface-lora
    set:
      - CONFIG_LORA_COUNT=1
      - CONFIG_LORA_SPI_HOST=2
      - CONFIG_LORA_SCK_PIN=9
      - CONFIG_LORA_MOSI_PIN=10
      - CONFIG_LORA_MISO_PIN=11
      - CONFIG_LORA0_CS_PIN=8
      - CONFIG_LORA0_RST_PIN=12
      - CONFIG_LORA0_BUSY_PIN=13
      - CONFIG_LORA0_DIO1_PIN=14
      - CONFIG_LORA0_RADIO_LR2021=y
      # Plain crystal on XTA/XTB — no TCXO to power, so no control voltage.
      - CONFIG_LORA0_TCXO_MV=0
      # GPIO 14 is wired to the chip's DIO8, not the DIO5 RadioLib assumes.
      # DIO5 is not bonded out on this board, so the default would point every
      # interrupt at a pin that is not there: the radio comes up, calls itself
      # healthy, and never reports a frame.
      - CONFIG_LORA0_LR_IRQ_DIO=8
      # The front end, switched by the radio itself. Five masks over the chip's
      # own DIOs (bit 0 = DIO5 … bit 6 = DIO11):
      #   DIO5  (bit 0) → RFX2402E 2G4_TX_EN   high in tx_hf
      #   DIO6  (bit 1) → RFX2402E 2G4_RX_EN   high in rx_hf
      #   DIO9  (bit 4) → GC1109 CTX           high in tx
      #   DIO10 (bit 5) → GC1109 CPS           high in tx  (low = bypass)
      #   DIO11 (bit 6) → GC1109 CSD           high in rx and tx (low = shutdown)
      # So standby powers everything down, sub-GHz RX opens the GC1109's LNA,
      # sub-GHz TX takes its full PA path, and the 2.4 GHz pair is selected on
      # its own without the GC1109 in circuit.
      - CONFIG_LORA0_LR_RFSW_IDLE=0x00
      - CONFIG_LORA0_LR_RFSW_RX=0x40
      - CONFIG_LORA0_LR_RFSW_TX=0x70
      - CONFIG_LORA0_LR_RFSW_RX_HF=0x02
      - CONFIG_LORA0_LR_RFSW_TX_HF=0x01
      # The two front ends' supply gates, active high. iface-lora raises the one
      # the configured carrier needs and drops the other, so tuning across
      # 1500 MHz moves the supply with the frequency and the amplifier for the
      # band nobody is using draws nothing. Both nets are pulled up on the
      # board, so a build without iface-lora simply leaves both powered.
      - CONFIG_LORA0_FEM_PWR_PIN=4       # PA_EN_M — GC1109, sub-GHz
      - CONFIG_LORA0_FEM_HF_PWR_PIN=3    # PA_EN_G — RFX2402E, 2.4 GHz
      # The GC1109's gain, and the ceiling it puts at the antenna — both the
      # datasheet's own figures for the part (860-930 MHz, small-signal gain
      # 30 dB, saturated output +30 dBm), which is also the relationship
      # between them: 30 dB of gain reaches +30 dBm from 0 dBm of drive. The
      # pair is a guard as much as a conversion, since the LR2021 will
      # cheerfully deliver +22 dBm into a part whose TX port does not want it.
      #
      # The gain is applied flat, so it is exact through the linear region and
      # a little shy at the very top: a real PA compresses, and MeshCore's
      # measurement on this board puts full saturation nearer +3 dBm of drive
      # than 0. Erring low is the right way round — the alternative overstates
      # every rung below the ceiling and overdrives the part.
      - CONFIG_LORA0_FEM_GAIN_DB=30
      - CONFIG_LORA_TX_POWER_MAX=30
      # The same for the 2.4 GHz path, through the RFX2402E. The chip's own
      # ceiling on that port is +12 dBm rather than +22, and the part saturates
      # around +20 dBm out, so 22 dB of gain against a 20 dBm ceiling asks the
      # chip for -2 dBm at the top — inside its range with room to spare, and
      # linear below it rather than pinned at saturation across the whole
      # slider. Trim both if a power meter disagrees.
      - CONFIG_LORA0_FEM_HF_GAIN_DB=22
      - CONFIG_LORA_TX_POWER_MAX_HF=20
  # 0.96" SSD1315 128x64 OLED (an SSD1306 part) on I2C, powered off the Vext
  # rail W12Board::onStart brings up, with the panel's reset on GPIO 21. The
  # BOOT/PRG button (GPIO 0) advances the page. Gated: without tinylcd staged
  # these symbols don't exist.
  - when: spangap/tinylcd
    set:
      - CONFIG_TINYLCD_SDA_PIN=17
      - CONFIG_TINYLCD_SCL_PIN=18
      - CONFIG_TINYLCD_RST_PIN=21
      - CONFIG_TINYLCD_BUTTON_PIN=0
      # Page dots default to "top unless flipped": the PRG button sits above the
      # screen in orientation 0, and the dots track it through a flip.
      - CONFIG_TINYLCD_PAGE_INDICATOR=2
  # GNSS receiver (consumed by spangap/gps, staged above) — a Quectel L76K on
  # the board's GNSS header, NMEA over UART1 8N1. Host RX <- receiver TX = 38;
  # host TX -> receiver RX = 39. FORCE_ON/wake is GPIO 40. The receiver's
  # supply gate (GPIO 48) and reset (GPIO 42) are both active low and are driven
  # by W12Board::onStart — gps has no symbol for either. Gated on gps: the
  # CONFIG_GPS_* symbols are DEFINED by that straddle's Kconfig.
  - when: spangap/gps
    set:
      - CONFIG_GPS_UART_NUM=1
      - CONFIG_GPS_RX_PIN=38
      - CONFIG_GPS_TX_PIN=39
      - CONFIG_GPS_FORCE_PIN=40
